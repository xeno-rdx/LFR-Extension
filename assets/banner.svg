<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="LFR Extension banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1a1240"/>
      <stop offset="1" stop-color="#0c2a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="340" rx="22"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <circle cx="190" cy="90" r="260" fill="url(#glowA)">
      <animate attributeName="cx" values="190;230;190" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="270" r="280" fill="url(#glowB)">
      <animate attributeName="cy" values="270;230;270" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- decorative text lines (RTL on the right, LTR on the left) -->
    <g opacity="0.16" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
      <line x1="60" y1="285" x2="250" y2="285"/>
      <line x1="60" y1="305" x2="170" y2="305"/>
      <line x1="1140" y1="300" x2="950" y2="300"/>
      <line x1="1140" y1="320" x2="1030" y2="320"/>
    </g>

    <!-- logo mark -->
    <g transform="translate(95 82)" filter="url(#shadow)">
      <rect width="176" height="176" rx="40" fill="url(#mark)"/>
      <rect x="2" y="2" width="172" height="172" rx="38" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
      <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path d="M48 66H128"/>
        <path d="M108 44L130 66L108 88"/>
        <path d="M128 112H48"/>
        <path d="M68 90L46 112L68 134"/>
      </g>
    </g>

    <!-- title -->
    <text x="320" y="185" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="1" fill="url(#accent)">LFR Extension</text>
    <text x="324" y="232" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="500" fill="#e2e8f0" fill-opacity="0.9">Smart RTL / LTR  ·  Custom Fonts  ·  Obsidian Plugin</text>

    <!-- chips -->
    <g font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="18" font-weight="600">
      <rect x="324" y="258" width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.7"/>
      <text x="409" y="283" text-anchor="middle" fill="#ddd6fe">Auto Direction</text>
      <rect x="506" y="258" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.7"/>
      <text x="581" y="283" text-anchor="middle" fill="#bfdbfe">Font Manager</text>
      <rect x="668" y="258" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <text x="743" y="283" text-anchor="middle" fill="#99f6e4">PDF Export</text>
    </g>

    <!-- Persian tagline -->
    <text x="1105" y="62" text-anchor="end" direction="rtl" font-family="Vazirmatn,Tahoma,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" fill="#e2e8f0" fill-opacity="0.85">راست‌چین و چپ‌چین هوشمند</text>
    <text x="1105" y="94" text-anchor="end" direction="rtl" font-family="Vazirmatn,Tahoma,'Segoe UI',Arial,sans-serif" font-size="20" fill="#e2e8f0" fill-opacity="0.6">مدیریت فونت برای Obsidian</text>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
