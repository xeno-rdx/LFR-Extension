<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="900" height="6" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d00000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d00000" stop-opacity="1"/>
      <stop offset="1" stop-color="#d00000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="900" height="2" fill="#2b2b2b"/>
  <rect x="-250" y="1" width="250" height="4" fill="url(#glow)">
    <animate attributeName="x" from="-250" to="900" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
